name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: Syntax check
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

  test:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - name: Install bsdtar for format compatibility tests
        run: sudo apt-get update -q && sudo apt-get install -y -q libarchive-tools
      - name: Start MySQL for database tests
        run: sudo systemctl start mysql.service && mysqladmin --user=root --password=root --wait=30 ping
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zlib, hash, json, mysqli, openssl, bz2
          coverage: none
      - uses: ramsey/composer-install@v3
      - name: PHPUnit
        run: vendor/bin/phpunit
        env:
          FMWP_TEST_DB_HOST: 127.0.0.1
          FMWP_TEST_DB_USER: root
          FMWP_TEST_DB_PASSWORD: root

  static:
    name: Coding standards and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: ramsey/composer-install@v3
      - name: Versions agree (header, FMWP_VERSION, readme.txt, CHANGELOG.md)
        run: sh tools/check-version.sh
      - name: PHP_CodeSniffer (WordPress Coding Standards + PHPCompatibility)
        run: vendor/bin/phpcs
      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  plugin-check:
    name: Plugin Check (WordPress.org rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the plugin as released
        run: mkdir -p build && git archive --format=tar --prefix=founders-migration-website/ HEAD | tar -x -C build
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: build/founders-migration-website
